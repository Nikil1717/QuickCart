server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:

      routes:

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: catalog-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/categories/**,/api/products/**,/api/inventory/**

        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/payments/**

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/notifications/**