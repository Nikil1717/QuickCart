services:

  postgres:
    image: postgres:17

    container_name: quickcart-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nikil

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - quickcart-network

  redis:
    image: redis:7

    container_name: quickcart-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    networks:
      - quickcart-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0

    container_name: quickcart-zookeeper

    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    networks:
      - quickcart-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0

    container_name: quickcart-kafka

    restart: unless-stopped

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    networks:
      - quickcart-network

  zipkin:
    image: openzipkin/zipkin

    container_name: quickcart-zipkin

    restart: unless-stopped

    ports:
      - "9411:9411"

    networks:
      - quickcart-network

  auth-service:

    build:
      context: ../auth-service

    container_name: quickcart-auth

    restart: unless-stopped

    depends_on:
      - postgres
      - zipkin

    ports:
      - "8081:8081"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth_user_db
      DB_USERNAME: postgres
      DB_PASSWORD: nikil

      ZIPKIN_URL: http://zipkin:9411/api/v2/spans

      JWT_SECRET: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXphYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5eg==

    networks:
      - quickcart-network

  catalog-service:

    build:
      context: ../catalog-inventory-service

    container_name: quickcart-catalog

    restart: unless-stopped

    depends_on:
      - postgres
      - redis
      - zipkin

    ports:
      - "8082:8082"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      DB_USERNAME: postgres
      DB_PASSWORD: nikil

      REDIS_HOST: redis
      REDIS_PORT: 6379

      ZIPKIN_URL: http://zipkin:9411/api/v2/spans

      JWT_SECRET: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXphYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5eg==

    networks:
      - quickcart-network

  order-service:

    build:
      context: ../order-service

    container_name: quickcart-order

    restart: unless-stopped

    depends_on:
      - postgres
      - redis
      - kafka
      - zipkin

    ports:
      - "8083:8083"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: postgres
      DB_PASSWORD: nikil

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_SERVERS: kafka:9092

      ZIPKIN_URL: http://zipkin:9411/api/v2/spans

      JWT_SECRET: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXphYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5eg==

    networks:
      - quickcart-network

  payment-service:

    build:
      context: ../payment-service

    container_name: quickcart-payment

    restart: unless-stopped

    depends_on:
      - postgres
      - redis
      - kafka
      - zipkin

    ports:
      - "8084:8084"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: postgres
      DB_PASSWORD: nikil

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_SERVERS: kafka:9092

      ZIPKIN_URL: http://zipkin:9411/api/v2/spans

      JWT_SECRET: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXphYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5eg==

    networks:
      - quickcart-network

  notification-service:

    build:
      context: ../notification-service

    container_name: quickcart-notification

    restart: unless-stopped

    depends_on:
      - postgres
      - kafka
      - zipkin

    ports:
      - "8085:8085"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: postgres
      DB_PASSWORD: nikil

      KAFKA_SERVERS: kafka:9092

      ZIPKIN_URL: http://zipkin:9411/api/v2/spans

      JWT_SECRET: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXphYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5eg==

    networks:
      - quickcart-network

  gateway-service:

    build:
      context: ../gateway-service

    container_name: quickcart-gateway

    restart: unless-stopped

    depends_on:
      - auth-service
      - catalog-service
      - order-service
      - payment-service
      - notification-service
      - redis
      - zipkin

    ports:
      - "8080:8080"

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

      ZIPKIN_URL: http://zipkin:9411/api/v2/spans

      JWT_SECRET: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXphYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5eg==

    networks:
      - quickcart-network

volumes:

  postgres-data:

networks:

  quickcart-network: